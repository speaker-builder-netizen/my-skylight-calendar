# Family wall dashboard.
# Paste this into a dashboard's raw configuration editor.
#
# The previous dashboard put a YAML "#" comment inside a JavaScript function
# (the config-template-card STARTDAY variable). "#" is not a JavaScript
# comment, so the card threw a SyntaxError and the calendar rendered blank.
# That is upstream mohesles/my-skylight-calendar issue 33 and pull request 36.
# This dashboard has no embedded JavaScript, so that failure mode is gone.
#
# Weather is the one entity set here. Names, calendars, chores, and rewards
# are edited in www/skylight-wall/household.json.
title: Skylight
views:
  - type: panel
    title: Family
    path: home
    icon: mdi:white-balance-sunny
    theme: Skylight
    cards:
      - type: custom:skylight-wall-card
        weather_entity: weather.home # <--- UPDATE THIS ENTITY
        photo_media: media-source://media_source/local/photos
        photo_manifest: /local/photos/manifest.json
    background:
      opacity: 35
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image: /local/calbackgrd.png
