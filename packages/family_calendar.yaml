script:
  calendar1_calendar_visible_filter:
    alias: Toggle calendar1 Calendar
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar1_calendar_filter
        data:
          value: "{% if is_state('input_text.calendar1_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  calendar2_calendar_visible_filter:
    alias: Toggle calendar2 Calendar
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar2_calendar_filter
        data:
          value: "{% if is_state('input_text.calendar2_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  calendar3_calendar_visible_filter:
    alias: Toggle calendar3 Calendar
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar3_calendar_filter
        data:
          value: "{% if is_state('input_text.calendar3_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  calendar4_calendar_visible_filter:
    alias: Toggle calendar4 Calendar
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar4_calendar_filter
        data:
          value: "{% if is_state('input_text.calendar4_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  family_calendar_visible_filter:
    alias: Toggle Family Calendar
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.family_calendar_filter
        data:
          value: "{% if is_state('input_text.family_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  birthdays_calendar_visible_filter:
    alias: Toggle Birthdays Calendar
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.birthdays_calendar_filter
        data:
          value: "{% if is_state('input_text.birthdays_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  holidays_calendar_visible_filter:
    alias: Toggle Holidays Calendar
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.holidays_calendar_filter
        data:
          value: "{% if is_state('input_text.holidays_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  add_google_calendar_event:
    alias: Process Add Calendar Event
    mode: queued
    sequence:
      - variables:
          calendar_map:
            "calendar1": "calendar.calendar1" # <--- UPDATE THIS ENTITY
            "calendar2": "calendar.calendar2" # <--- UPDATE THIS ENTITY
            "calendar3": "calendar.calendar3" # <--- UPDATE THIS ENTITY
            "calendar4": "calendar.calendar4" # <--- UPDATE THIS ENTITY
            "Family": "calendar.family" # <--- UPDATE THIS ENTITY
          target_calendar: "{{ calendar_map.get(states('input_select.calendar_select'), 'calendar.family') }}"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.calendar_all_day_event
                state: "on"
            sequence:
              - action: calendar.create_event
                target:
                  entity_id: "{{ target_calendar }}"
                data:
                  summary: "{{ states('input_text.calendar_event_title') }}"
                  description: "{{ states('input_text.calendar_event_description') }}"
                  start_date: "{{ states('input_datetime.calendar_day_event_start') }}"
                  end_date: "{{ states('input_datetime.calendar_day_event_end') }}"
          - conditions:
              - condition: state
                entity_id: input_boolean.calendar_all_day_event
                state: "off"
            sequence:
              - action: calendar.create_event
                target:
                  entity_id: "{{ target_calendar }}"
                data:
                  summary: "{{ states('input_text.calendar_event_title') }}"
                  description: "{{ states('input_text.calendar_event_description') }}"
                  start_date_time: "{{ states('input_datetime.calendar_event_start') }}"
                  end_date_time: "{{ states('input_datetime.calendar_event_end') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar_event_title
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar_event_description
        data:
          value: ""
      - action: browser_mod.close_popup
        data: {}

  skylight_complete_chore:
    alias: Skylight mark chore done or undo
    mode: queued
    max: 40
    fields:
      person:
        required: true
        selector:
          text:
      slot:
        required: true
        selector:
          number:
            min: 1
            max: 8
      streak:
        required: true
        selector:
          number:
            min: 0
            max: 9999
      stars_delta:
        required: true
        selector:
          number:
            min: -50
            max: 50
      undo:
        selector:
          boolean:
    sequence:
      - variables:
          person_id: "{{ person }}"
          slot_n: "{{ slot | int }}"
          streak_n: "{{ [streak | int(0), 0] | max }}"
          delta_n: "{{ stars_delta | int(0) }}"
          undoing: "{{ undo | default(false) }}"
      - condition: template
        value_template: "{{ person_id in ['p1', 'p2', 'p3', 'p4'] and slot_n | int >= 1 and slot_n | int <= 8 }}"
      - action: counter.set_value
        target:
          entity_id: "counter.skylight_{{ person_id }}_c{{ slot_n | int }}_streak"
        data:
          value: "{{ streak_n | int }}"
      - action: counter.set_value
        target:
          entity_id: "counter.skylight_{{ person_id }}_stars"
        data:
          value: "{{ [(states('counter.skylight_' ~ person_id ~ '_stars') | int(0)) + (delta_n | int), 0] | max }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ undoing in [true, 'true', 'True', 'on', 'yes'] }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "input_datetime.skylight_{{ person_id }}_c{{ slot_n | int }}_done"
                data:
                  date: "2000-01-01"
        default:
          - action: input_datetime.set_datetime
            target:
              entity_id: "input_datetime.skylight_{{ person_id }}_c{{ slot_n | int }}_done"
            data:
              date: "{{ now().date().isoformat() }}"

  skylight_redeem_reward:
    alias: Skylight redeem a reward
    mode: queued
    fields:
      person:
        required: true
        selector:
          text:
      cost:
        required: true
        selector:
          number:
            min: 1
            max: 500
      reward:
        required: true
        selector:
          text:
    sequence:
      - variables:
          person_id: "{{ person }}"
          cost_n: "{{ cost | int(0) }}"
          reward_name: "{{ (reward | string)[:40] }}"
          current: "{{ states('counter.skylight_' ~ person ~ '_stars') | int(0) }}"
      - condition: template
        value_template: "{{ person_id in ['p1', 'p2', 'p3', 'p4'] and cost_n | int > 0 and current | int >= cost_n | int }}"
      - action: counter.set_value
        target:
          entity_id: "counter.skylight_{{ person_id }}_stars"
        data:
          value: "{{ (current | int) - (cost_n | int) }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.skylight_{{ person_id }}_rewards"
        data:
          value: >-
            {% set prev = states('input_text.skylight_' ~ person_id ~ '_rewards') %}
            {% set line = now().month ~ '/' ~ now().day ~ ' ' ~ reward_name %}
            {{ (line ~ '\n' ~ prev)[:240] }}

  skylight_set_meal:
    alias: Skylight set a meal
    mode: queued
    fields:
      day:
        required: true
        selector:
          text:
      meal:
        required: true
        selector:
          text:
      value:
        required: false
        selector:
          text:
    sequence:
      - condition: template
        value_template: "{{ day in ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] and meal in ['breakfast', 'lunch', 'dinner'] }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.skylight_meal_{{ day }}_{{ meal }}"
        data:
          value: "{{ (value | default('') | string | trim)[:80] }}"

  skylight_clear_meals:
    alias: Skylight clear the weekly meal plan
    mode: single
    sequence:
      - repeat:
          for_each:

            - mon_breakfast
            - mon_lunch
            - mon_dinner
            - tue_breakfast
            - tue_lunch
            - tue_dinner
            - wed_breakfast
            - wed_lunch
            - wed_dinner
            - thu_breakfast
            - thu_lunch
            - thu_dinner
            - fri_breakfast
            - fri_lunch
            - fri_dinner
            - sat_breakfast
            - sat_lunch
            - sat_dinner
            - sun_breakfast
            - sun_lunch
            - sun_dinner

          sequence:
            - action: input_text.set_value
              target:
                entity_id: "input_text.skylight_meal_{{ repeat.item }}"
              data:
                value: ""

shell_command:
  skylight_photo_manifest: >-
    python3 -c "import json,os; p='/config/www/photos'; os.makedirs(p, exist_ok=True); ex={'.jpg','.jpeg','.png','.webp','.gif'}; fs=sorted(f for f in os.listdir(p) if os.path.splitext(f)[1].lower() in ex and f != 'manifest.json'); open(os.path.join(p,'manifest.json'),'w',encoding='utf-8').write(json.dumps({'photos':fs}))"

automation:
  - id: skylight_sleep_flag
    alias: Skylight sleep flag
    mode: restart
    trigger:
      - platform: time
        at: input_datetime.skylight_sleep_start
      - platform: time
        at: input_datetime.skylight_sleep_end
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_boolean.skylight_sleep_enabled
          - input_datetime.skylight_sleep_start
          - input_datetime.skylight_sleep_end
    action:
      - variables:
          asleep: >-
            {% set enabled = is_state('input_boolean.skylight_sleep_enabled', 'on') %}
            {% set start = states('input_datetime.skylight_sleep_start') %}
            {% set end = states('input_datetime.skylight_sleep_end') %}
            {% set now_t = now().strftime('%H:%M:%S') %}
            {% if not enabled or start == end %}
            no
            {% elif start < end %}
            {{ 'yes' if start <= now_t < end else 'no' }}
            {% else %}
            {{ 'yes' if now_t >= start or now_t < end else 'no' }}
            {% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ asleep | trim == 'yes' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.skylight_asleep
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.skylight_asleep

  - id: skylight_photo_manifest
    alias: Skylight refresh photo manifest
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        hours: "/6"
    action:
      - action: shell_command.skylight_photo_manifest

