# =============================================================================
# FAMILY WALL PACKAGE
# =============================================================================
# Install: copy this file to /config/packages/family_calendar.yaml
# and make sure configuration.yaml contains:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# HOUSEHOLD — edit ONE file, then refresh the wall browser:
#   /config/www/skylight-wall/household.json
#   (this repo: www/skylight-wall/household.json)
#
# Change names, colors, avatars, calendar entity ids, chore labels,
# rewards, and list entity ids there. Member ids p1-p4 and chore slots
# 1-8 are the helpers below. Do not rename those helpers.
# Calendar entity ids inside the legacy add-event script still have
# an UPDATE THIS ENTITY marker for the old popup path. The wall itself
# reads calendars from household.json.
# =============================================================================

